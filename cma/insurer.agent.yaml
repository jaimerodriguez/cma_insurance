name: insurance-insurer
model: claude-haiku-4-5
system: "You are an AI assistant speaking directly with an insurance\npolicyholder. \nYou can \n(1) help them file a new claim — gather policy, loss type(s),\na description, and an estimated cost, then create it (new claims are routed to intake\nadjuster \"unassigned\") \n(2) answer questions about the status of THIS policyholder's own claims. \nNever approve, deny, escalate, or reveal other policyholders' claims. \n(3) if the insurer asks for contact info for the assigned adjuster, you can share it only if the adjuster's preference allows it.  If not allowed, don't share it. If claim is not assigned, let them know.  \nDon't volunteer the adjuster's details unless the insurer asks.  \n\nBe warmand clear, and confirm details before filing. For all incidents or conversations, try to detect any emotional aspects of the claim being filed. Was the insurer frustrated? was he friendly. \nNote these emotional observations in the incident's history, or the insurer's history.  These details are useful for later decisions and escalations.  \n\n"
tools:
- type: custom
  name: get_incident_details
  description: Look up a single incident by its id.
  input_schema:
    type: object
    properties:
      incident_id:
        type: string
        description: The incident/case id to fetch (e.g. "case-3001").
    additionalProperties: false
    required:
    - incident_id
- type: custom
  name: list_incidents_for_insurer
  description: List the incidents (claims) belonging to a given insurer (policyholder).  Use this to answer a policyholder's questions about the status of their own claims.
  input_schema:
    type: object
    properties:
      insurer_id:
        type: string
        description: The insurer's id whose incidents to list (e.g. "ins-1001").
    additionalProperties: false
    required:
    - insurer_id
- type: custom
  name: find_insurer
  description: Look up a single insurer (policyholder) by id.
  input_schema:
    type: object
    properties:
      insurer_id:
        type: string
        description: The insurer's id / lookup key (e.g. "ins-1001").
    additionalProperties: false
    required:
    - insurer_id
- type: custom
  name: find_policy
  description: Look up a single policy by id.
  input_schema:
    type: object
    properties:
      policy_id:
        type: string
        description: The policy's id / lookup key (e.g. "pol-2001").
    additionalProperties: false
    required:
    - policy_id
- type: custom
  name: retrieve_policies
  description: List every policy held by a given insurer (policyholder).  Use this to see which policies a policyholder holds (e.g. before filing a claim against one of them).
  input_schema:
    type: object
    properties:
      insurer_id:
        type: string
        description: The insurer's id whose policies to list (e.g. "ins-1001").
    additionalProperties: false
    required:
    - insurer_id
- type: custom
  name: create_incident
  description: Create a new incident (claim) and persist it.  A fresh unique id is generated, ``submitted_date`` is set to now (UTC), ``status`` defaults to ``ReportStatus.NEW`` and ``resolution`` to ``Resolution.INPROGRESS``. The new incident is saved before being returned.  The referenced ids are stored as-is and not validated here; use ``find_adjuster``/``find_insurer``/``find_policy`` first if you need to confirm they exist.
  input_schema:
    type: object
    properties:
      adjuster_id:
        type: string
        description: Id of the adjuster who will handle the claim (e.g. "jaime").
      type:
        type: integer
        description: 'One or more ``ReportType`` flags describing the loss. Combine with ``|`` (or by adding the values) when a single event caused several kinds of loss, e.g. ``STOLEN_CAR | CAR_ACCIDENT`` = 5, or ``HOME_ACCIDENT | HOME_NATURAL_DISASTER`` = 48 for storm damage that also burst a pipe. A dwelling loss (any HOME_* flag) raises the auto-approval ceilings during triage, so pick the home flags for home losses even when the claim sits on a non-HOME policy. Integer bitmask; combine values by adding. Members: STOLEN_CAR=1, STOLEN_OTHER=2, CAR_ACCIDENT=4, HOME_THEFT=8, HOME_ACCIDENT=16, HOME_NATURAL_DISASTER=32.'
      details:
        type: string
        description: Free-text description of the incident.
      insurer_id:
        type: string
        description: Id of the insurer/policyholder (e.g. "ins-1001").
      policy_id:
        type: string
        description: Id of the policy the claim is filed against (e.g. "pol-2001").
      estimate_cost:
        type: integer
        description: Estimated cost of the incident in whole dollars. Used by ``process_incident``. Defaults to 0.
    additionalProperties: false
    required:
    - adjuster_id
    - type
    - details
    - insurer_id
    - policy_id
- type: custom
  name: append_insurer_history
  description: Append a date-stamped note to an insurer's history log and save it.
  input_schema:
    type: object
    properties:
      insurer_id:
        type: string
        description: The insurer's id (e.g. "ins-1001").
      note:
        type: string
        description: The interaction to record (without a date; it is added for you).
    additionalProperties: false
    required:
    - insurer_id
    - note
- type: custom
  name: append_insurer_preferences
  description: Append a preference line to an insurer (policyholder) and save it.  Unlike history, preferences are *not* date-stamped — they describe standing wishes. The note is added on its own line.
  input_schema:
    type: object
    properties:
      insurer_id:
        type: string
        description: The insurer's id (e.g. "ins-1001").
      note:
        type: string
        description: The preference to add, e.g. "Their name is Joseph, but goes by Joe".
    additionalProperties: false
    required:
    - insurer_id
    - note
